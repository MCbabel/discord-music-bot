<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — MelodyBot</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface": "#131313",
        "surface-container-lowest": "#0e0e0e",
        "surface-container-low": "#1b1b1b",
        "surface-container": "#1f1f1f",
        "surface-container-high": "#2a2a2a",
        "surface-container-highest": "#353535",
        "surface-variant": "#353535",
        "surface-bright": "#393939",
        "on-surface": "#e2e2e2",
        "on-surface-variant": "#c2c6d8",
        "on-background": "#e2e2e2",
        "background": "#131313",
        "primary": "#b3c5ff",
        "primary-container": "#0064ff",
        "on-primary": "#002a76",
        "on-primary-container": "#f5f5ff",
        "secondary": "#bec2ff",
        "secondary-container": "#2532c4",
        "outline": "#8c90a2",
        "outline-variant": "#424656",
        "error": "#ffb4ab",
      },
      fontFamily: {
        "headline": ["Inter"],
        "body": ["Inter"],
        "mono": ["JetBrains Mono"]
      },
      borderRadius: {
        "DEFAULT": "0.125rem",
        "lg": "0.25rem",
        "xl": "0.5rem",
        "2xl": "0.75rem",
        "3xl": "1rem"
      },
    },
  },
}
</script>
<style>
body {
  background-color: #131313;
  color: #e2e2e2;
  overflow-x: hidden;
}
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
}
.btn-hover-effect {
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-hover-effect::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease;
}
.btn-hover-effect:hover::after {
  width: 300%;
  height: 300%;
}
/* 404 glow */
.error-glow {
  text-shadow: 0 0 40px rgba(0, 100, 255, 0.4), 0 0 80px rgba(0, 100, 255, 0.2), 0 0 120px rgba(0, 100, 255, 0.1);
}
@keyframes subtle-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.float-subtle {
  animation: subtle-float 4s ease-in-out infinite;
}
</style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">

<!-- Atmospheric Glow -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-[100vw] h-[70vh] pointer-events-none z-0" style="background: radial-gradient(ellipse at center top, rgba(0,100,255,0.10) 0%, transparent 65%);"></div>

<!-- Main Content -->
<main class="flex-1 flex items-center justify-center px-6 relative z-10">
  <div class="text-center max-w-lg">

    <!-- 404 Number -->
    <div class="float-subtle mb-8">
      <span class="text-[8rem] md:text-[12rem] font-black tracking-tighter leading-none text-transparent bg-clip-text bg-gradient-to-b from-primary-container to-secondary-container error-glow select-none">
        404
      </span>
    </div>

    <!-- Label -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-low border border-outline-variant/10 mb-6">
      <span class="material-symbols-outlined text-sm text-primary-container">music_off</span>
      <span class="font-mono text-[10px] uppercase tracking-widest text-on-surface-variant">Track Not Found</span>
    </div>

    <!-- Message -->
    <p class="text-on-surface-variant text-lg leading-relaxed mb-10">
      This page doesn't exist in our playlist.<br class="hidden md:block"/>
      The track you're looking for couldn't be found.
    </p>

    <!-- CTA -->
    <a href="./" class="inline-flex items-center gap-2 bg-primary-container text-on-primary-container px-8 py-4 rounded-xl font-bold text-lg hover:scale-105 active:scale-95 transition-all shadow-xl shadow-primary-container/20 btn-hover-effect">
      <span class="material-symbols-outlined">home</span>
      Back to Home
    </a>

    <!-- Terminal hint -->
    <div class="mt-16 inline-block bg-surface-container-lowest border border-outline-variant/10 rounded-xl px-5 py-3">
      <div class="font-mono text-xs text-on-surface-variant/40 flex items-center gap-2">
        <span class="text-primary-container">$</span>
        <span>melodybot resolve <span class="text-error/60">404</span></span>
        <span class="text-on-surface-variant/20">— page not in queue</span>
      </div>
    </div>

  </div>
</main>

</body>
</html>
